# Sjekker hver pull request før den kan flettes: commit-meldingene og tittelen, at utvidelsen
# følger Manifest V3 og kravene i Chrome Web Store, og at pakken kan bygges.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# En ny push til samme pull request avbryter kjøringen som allerede går.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hele historikken, så commitene i pull requesten kan sjekkes

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Tittelen blir commit-meldingen når pull requesten flettes med squash.
      - name: Tittelen på pull requesten
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          node tools/check-commit.mjs "$RUNNER_TEMP/title"

      - name: Commit-meldinger
        if: github.event_name == 'pull_request'
        run: node tools/check-commit.mjs "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Syntaks i skriptene
        run: |
          for f in background.js content/*.js popup/*.js tools/*.mjs; do
            node --check "$f"
          done

      - name: Manifest V3, tillatelser og html.bc
        run: node tools/check-extension.mjs

      - name: Ikonene er bygget
        run: |
          node tools/build-icons.mjs
          git diff --exit-code content/icons.css || (echo "::error::Kjør node tools/build-icons.mjs og commit content/icons.css" && exit 1)

      # Bare en påminnelse: ikke alle endringer i koden merkes av brukerne.
      - name: Endringslogg
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          if echo "$changed" | grep -qE '^(content|popup)/|^manifest\.json$|^background\.js$' && ! echo "$changed" | grep -q '^CHROMEWEBSTORE\.md$'; then
            echo "::warning::Koden er endret uten en linje under «Ikke publisert» i CHROMEWEBSTORE.md. Legg til en hvis brukerne merker endringen."
          fi

      - name: Bygg pakken
        run: python3 tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: bedre-canvas
          path: dist/*.zip
